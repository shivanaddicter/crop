<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | AgriSense</title>
  <meta name="description" content="Create your AgriSense account and start predicting optimal crops with AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020c14;
      color: #f0fdf4;
      padding: 40px 20px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(34,197,94,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 100% 100%, rgba(16,163,74,0.06) 0%, transparent 60%);
    }

    .container { width: 100%; max-width: 480px; }

    /* ── Brand ── */
    .brand { text-align: center; margin-bottom: 28px; }

    .brand-icon {
      width: 62px; height: 62px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      margin: 0 auto 14px;
      box-shadow: 0 0 36px rgba(34,197,94,0.35);
    }

    .brand h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
    .brand h1 span { color: #22c55e; }
    .brand p { color: #64748b; font-size: 13px; margin-top: 4px; }

    /* ── Card ── */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 36px;
      backdrop-filter: blur(24px);
    }

    .card-header { margin-bottom: 28px; }
    .card-header h2 { font-size: 22px; font-weight: 700; }
    .card-header p  { font-size: 13px; color: #64748b; margin-top: 4px; }

    /* ── Form fields ── */
    .form-group { margin-bottom: 16px; }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 7px;
    }

    .form-input {
      width: 100%;
      padding: 13px 15px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 11px;
      color: #f0fdf4;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-input:focus {
      border-color: #22c55e;
      background: rgba(34,197,94,0.05);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.1);
    }

    .form-input::placeholder { color: #334155; }

    /* ── Django form as_p styles ── */
    #reg-form p {
      margin-bottom: 16px;
    }
    #reg-form p label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 7px;
    }
    #reg-form p input[type=text],
    #reg-form p input[type=password] {
      width: 100%;
      padding: 13px 15px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 11px;
      color: #f0fdf4;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: all 0.25s ease;
      box-sizing: border-box;
    }
    #reg-form p input:focus {
      border-color: #22c55e;
      background: rgba(34,197,94,0.05);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.1);
    }
    #reg-form ul.errorlist {
      color: #f87171;
      font-size: 12px;
      list-style: none;
      margin-top: 5px;
      padding: 0;
    }
    #reg-form .helptext,
    #reg-form p > span.helptext {
      display: block;
      font-size: 11px;
      color: #475569;
      margin-top: 4px;
      line-height: 1.5;
    }

    /* ── Password strength helper ── */
    .pwd-hints {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 10px;
      margin-bottom: 4px;
    }

    .hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #475569;
      padding: 5px 8px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
    }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 28px rgba(34,197,94,0.3);
      margin-top: 8px;
      letter-spacing: 0.02em;
    }

    .btn-submit:hover {
      box-shadow: 0 0 42px rgba(34,197,94,0.5);
      transform: translateY(-2px);
    }

    .btn-submit:active { transform: translateY(0); }

    /* ── Footer ── */
    .form-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #64748b;
    }

    .form-footer a { color: #22c55e; text-decoration: none; font-weight: 600; }
    .form-footer a:hover { text-decoration: underline; }

    /* ── Terms note ── */
    .terms-note {
      font-size: 11px;
      color: #334155;
      text-align: center;
      margin-top: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="container">

  <div class="brand">
    <div class="brand-icon">🌾</div>
    <h1>Agri<span>Sense</span></h1>
    <p>AI-powered crop yield prediction</p>
  </div>

  <div class="card">
    <div class="card-header">
      <h2>Create your account ✨</h2>
      <p>Join AgriSense and start predicting optimal crops with AI</p>
    </div>

    <form method="POST" id="reg-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-submit" id="regBtn">Create Account →</button>
    </form>

    <p class="terms-note">
      By creating an account you agree to use this platform responsibly for agricultural purposes.
    </p>
  </div>

  <div class="form-footer">
    Already have an account? <a href="{% url 'login' %}">Sign in →</a>
  </div>

</div>

<script>
  document.getElementById('reg-form').addEventListener('submit', function() {
    const btn = document.getElementById('regBtn');
    btn.textContent = '⏳ Creating account…';
    btn.disabled = true;
  });
</script>

</body>
</html>
